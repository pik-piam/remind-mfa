model: 'plastics'

transience: 
  transience_run: True
  baseline_pickle_path: 'model_plastics_SSP2_transience_CE-PET_fd_plastics_S0_default_2c0a4149_2026-06-29--09-13-07.pickle'
  transience_scenario: 'CE-PET_fd_plastics_S0' # 'CE-PET_fd_plastics_S0', 'CE-PET_fd_plastics_S1', 'CE-PET_fd_plastics_S2'
  trade_scenario: 'default' # 'default', 'fix_supply_alpha0' (export expansion), or 'fix_supply_alpha1' (import substitution)

input:
  force_extract_tgz: False
  input_data_path: '../remind_mfa_data'
  input_data_revision: '1.5.0fix_plWastePolymerSplit'
  region_mapping: '2c0a4149' # EU27+3 TRANSIENCE region mapping
  scenarios_path: 'config/scenarios'

model_switches:
  scenario: 'SSP2'
  stock_extrapolation_class_name: 'LogisticExtrapolation'
  regress_over: 'loggdppc'
  do_stock_extrapolation_with_time_factor: True
  lifetime_model_name: 'LogNormalLifetime'
  do_stock_extrapolation_by_category: True
  parameter_extrapolation:
    waste_his_imports: LinearToTargetExtrapolation
    waste_his_exports: LinearToTargetExtrapolation
    collection_rate: LinearToTargetExtrapolation
    landfill_rate: LinearToTargetExtrapolation
    mechanical_recycling_rate: LinearToTargetExtrapolation
    chemical_recycling_rate: LinearToTargetExtrapolation
    bio_production_rate: LinearToTargetExtrapolation
    daccu_production_rate: LinearToTargetExtrapolation
    emission_capture_rate: ConstantExtrapolation
    material_shares_use_inflow: ConstantExtrapolation

visualization:
  do_visualize: True
  do_show_figs: True
  do_save_figs: False
  figures_path: 'data/plastics/output/transience/figures'
  use_stock:
    do_visualize: False
    over_gdp: True
    accumulate_gdp: False
    per_capita: True
  gdp:
    do_visualize: False
    per_capita: False
  consumption:
    do_visualize: False
    per_capita: True
  production:
    do_visualize: True
  trade:
    do_visualize: True
  extrapolation:
    do_visualize: False
  sankey:
    do_visualize: True
    plotter_args:
      slice_dict:
        t: 2019
        r: 'EU27+3'
        m: 'PET'
      exclude_processes:
        - "sysenv"
        - "atmosphere"
        - "feedfoss"
        - "feedbio"
        - "feeddaccu"
        - "feedccu"
        - "HVC_input"
        - "C4_input"
        - "other_reactants"
        - "emission"
        - "uncontrolled"
        - "incineration"
        - "losses"
        - "reclchem"
        - "mismanaged"
        - "landfill"
        #- "waste_market"
        #- "primary_market"
        #- "intermediate_market"
        #- "good_market"
      exclude_flows: [ ]
  sector_splits:
    do_visualize: False
  flows:
    do_visualize: False

export:
  do_export: True
  path: 'data/plastics/output/transience'
  pickle:
    do_export: True
  csv:
    do_export: False
  iamc:
    do_export: False
  assumptions:
    do_export: False
  docs:
    do_export: False
    path: 'docs/plastics'
