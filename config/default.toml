[base]
    [base.input]
        force_extract_tgz = false
        input_data_path = "data_in"
        input_data_revision = "2.9.2"
        region_mapping = "h12"
        scenarios_path = "config/scenarios"

    [base.model_switches]
        scenario = "SSP2"
        stock_extrapolation_class_name = "LogisticExtrapolation"
        lifetime_model_name = "LogNormalLifetime"

    [base.export]
        do_export = true
        path = "data_out"
        bundle_export = false
        # prefix = "test"
        pickle.do_export = true
        csv.do_export = false
        iamc_reporting.do_export = false
        iamc_raw.do_export = false
        mrindustry.do_export = false
        assumptions.do_export = false
        docs.do_export = false
        docs.apply_mappings = true

[cement]
    [cement.model_switches]
        carbonation = false
        parameter_reconciliation = false
