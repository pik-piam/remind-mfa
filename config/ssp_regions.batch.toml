# Batch layer: all SSPs at h12 resolution, and SSP2 at country (iso249) resolution.
# Run with: uv run remind-mfa --config default --config ssp_regions.batch

[base]
    [base.export]
        prefix = "ssp_regions"

[[batch_grid]]
model = ["steel", "cement", "plastics"]
model_switches.scenario = ["SSP1", "SSP2", "SSP3", "SSP4", "SSP5"]
input.region_mapping = ["h12"]

[[batch_grid]]
model = ["steel", "cement", "plastics"]
model_switches.scenario = ["SSP2"]
input.region_mapping = ["iso249"]
