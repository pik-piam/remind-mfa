[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[project]
name = "remind-mfa"
version = "0.2.0"
authors = [
    { name = "Jakob Dürrwächter" },
    { name = "Bennet Weiss" },
    { name = "Leonie Schweiger" },
    { name = "Tobias Diez},
    { name = "Sally Dacie" },
    { name = "Merlin Hosak" },
]

requires-python = ">= 3.12"
dependencies = [
    "matplotlib>=3.7.1,!=3.9.1",
    "numpy>=1.25.0",
    "scipy>=1.11.0",
    "typer>=0.12.0",
    "statsmodels>=0.14.0",
    "pandas>=2.0.2",
    "pickle4>=0.0.1",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
    "xlwt>=1.3.0",
    "plotly>=5.18.0",
    "pydantic>=2.8.2",
    "flodym>=1.0.0",
    "pyam-iamc>=3.5.0",
    "ixmp4>=0.16.4",
    "tabulate>=0.9.0",
    "dotenv>=0.9.9",
    "tqdm>=4.70.0",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-bibtex>=4.4.0",
    "mkdocs-include-markdown-plugin>=7.2.0",
    "pypandoc-binary>=1.16.2",
]
dev = [
    "black>=25.1.0",
    "marimo>=0.23.14",
    "nbformat>=5.10.4",
    "pytest>=9.1.1",
    "questionary>=2.0.1",
    { include-group = "docs" },
]

# [tool.uv.sources]
# flodym = { path = "../flodym", editable = true }

[tool.uv.build-backend]
module-name = "remind_mfa"
module-root = ""

[tool.black]
line-length = 100
