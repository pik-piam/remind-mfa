[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[project]
name = "remind-mfa"
version = "0.2.0"
authors = [
    { name = "Jakob Dürrwächter" },
    { name = "Bennet Weiss" },
    { name = "Leonie Schweiger" },
    { name = "Tobias Diez" },
    { name = "Qianzhi Zhang" },
    { name = "Sally Dacie" },
    { name = "Merlin Hosak" },
]

requires-python = ">= 3.14"
dependencies = [
    "matplotlib>=3.7.1,!=3.9.1",
    "numpy>=1.25.0",
    "scipy>=1.11.0",
    "typer>=0.12.0",
    "statsmodels>=0.14.0",
    "pandas>=2.0.2",
    "pickle4>=0.0.1",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
    "xlwt>=1.3.0",
    "plotly>=5.18.0",
    "pydantic>=2.8.2",
    "flodym>=1.1.0",
    "pyam-iamc>=3.5.0",
    "ixmp4>=0.16.4",
    "tabulate>=0.9.0",
    "dotenv>=0.9.9",
    "kaleido>=1.4.0",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-bibtex>=4.4.0",
    "mkdocs-include-markdown-plugin>=7.2.0",
    "pypandoc-binary>=1.16.2",
]
dev = [
    "black>=25.1.0",
    "graphviz>=0.21",
    "marimo>=0.23.14",
    "nbformat>=5.10.4",
    "pytest>=9.1.1",
    "questionary>=2.0.1",
    "ty>=0.0.88",
    { include-group = "docs" },
]

# [tool.uv.sources]
# flodym = { path = "../flodym", editable = true }

[tool.uv.build-backend]
module-name = "remind_mfa"
module-root = ""

[tool.black]
line-length = 100

[tool.ty.rules]
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
missing-argument = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
invalid-assignment = "ignore"
pydantic-discarded-extra-argument = "ignore"
too-many-positional-arguments = "ignore"
invalid-method-override = "ignore"
invalid-return-type = "ignore"
unknown-argument = "ignore"
invalid-parameter-default = "ignore"
unresolved-import = "ignore"
redundant-condition = "ignore"
invalid-type-form = "ignore"
invalid-mutable-override = "ignore"

# Manifest for the flodym designer, which runs the models in the browser with Pyodide.
# It lists the files to load, as globs relative to this file (`**` is recursive),
# and the entry point of each model (see `remind_mfa/designer.py`).
[tool.flodym-designer]
sys-path = ["."]
packages = []
files = [
    "remind_mfa/**/*.py",
    "config/default.toml",
    "config/browser.toml",
    "config/scenarios/*.csv",
    # rev.txt and regions.txt mark the extracted input data as up to date, so no extraction is tried
    "data_in/parameters/rev.txt",
    "data_in/parameters/regions.txt",
    "data_in/parameters/regionmapping.csv",
]
exclude = []

[tool.flodym-designer.entries.steel]
title = "Steel"
call = "remind_mfa.designer:load"
args = { model = "steel" }
default-system = "future"
files = [
    "data_in/dimensions/steel/*.csv",
    "data_in/parameters/st_*.cs4r",
    "data_in/legacy/input_data/st_end_use_split_gdppc_high.cs4r",
    "data_in/legacy/input_data/st_end_use_split_gdppc_low.cs4r",
    "data_in/legacy/input_data/st_end_use_split_medium_inco.cs4r",
]

[tool.flodym-designer.entries.cement]
title = "Cement"
call = "remind_mfa.designer:load"
args = { model = "cement" }
default-system = "future"
files = [
    "data_in/dimensions/cement/*.csv",
    "data_in/parameters/ce_*.cs4r",
]

[tool.flodym-designer.entries.plastics]
title = "Plastics"
call = "remind_mfa.designer:load"
args = { model = "plastics" }
default-system = "future"
# parameters are listed explicitly, since `pl_*.cs4r` would also match large unused files
files = [
    "data_in/dimensions/plastics/*.csv",
    "data_in/parameters/pl_bio_production_rate.cs4r",
    "data_in/parameters/pl_c4_input_shares.cs4r",
    "data_in/parameters/pl_carbon_content_polymers.cs4r",
    "data_in/parameters/pl_chemical_recycling_rate.cs4r",
    "data_in/parameters/pl_collection_rate.cs4r",
    "data_in/parameters/pl_daccu_production_rate.cs4r",
    "data_in/parameters/pl_emission_capture_rate.cs4r",
    "data_in/parameters/pl_end_use_polymer_split.cs4r",
    "data_in/parameters/pl_gdppc.cs4r",
    "data_in/parameters/pl_hvc_input_shares.cs4r",
    "data_in/parameters/pl_incineration_rate.cs4r",
    "data_in/parameters/pl_lifetime_mean.cs4r",
    "data_in/parameters/pl_lifetime_std.cs4r",
    "data_in/parameters/pl_manufactured_products_exports.cs4r",
    "data_in/parameters/pl_manufactured_products_imports.cs4r",
    "data_in/parameters/pl_mechanical_recycling_rate.cs4r",
    "data_in/parameters/pl_mechanical_recycling_yield.cs4r",
    "data_in/parameters/pl_polymerization_yield.cs4r",
    "data_in/parameters/pl_population.cs4r",
    "data_in/parameters/pl_primary_exports.cs4r",
    "data_in/parameters/pl_primary_imports.cs4r",
    "data_in/parameters/pl_production.cs4r",
    "data_in/parameters/pl_reclmech_loss_uncontrolled_rate.cs4r",
    "data_in/parameters/pl_waste_exports.cs4r",
    "data_in/parameters/pl_waste_imports.cs4r",
    "data_in/legacy/input_data/pl_chemical_recycling_yield.cs4r",
]
