name: CI-Run

on:
  push:
    branches: [ "main" ]
  pull_request_target:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Branch, tag or SHA whose model run the results are compared against"
        default: main
        type: string

permissions:
  contents: read

jobs:
  run-model:
    name: Run model
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: run-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      MADRAT_OUTPUTFOLDER: ${{ github.workspace }}/madrat_output
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The run of all models, which the ci layer writes and blicket loads as one run; its build
      # is deployed as the viewer, after a comparison with the build of the baseline run, whose
      # Markdown summary blicket writes to $SUMMARY.
      RUN: data_out/ci_series
      BASELINE_RUN: data_out/baseline_series
      BASELINE_BUILD: ${{ github.workspace }}/data_out/blicket_builds/baseline
      BUILD: ${{ github.workspace }}/data_out/blicket_builds/current
      SUMMARY: ${{ github.workspace }}/data_out/comparison_summary.md
      # The run is compared against the following baseline:
        # - Manual runs against the input
        # - Pushes to main against the previous commit
        # - PRs against the base branch
      BASELINE_REF: ${{ inputs.baseline_ref || (github.event_name == 'push' && github.event.before) || github.event.pull_request.base.ref || 'main' }}
    # Guard: Only run this job on PRs only for trusted contributors (since we are using secrets and accessing the HPC)
    if: github.event_name != 'pull_request_target' || github.event.pull_request.author_association == 'COLLABORATOR' || github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.user.login == 'renovate[bot]'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        submodules: false
        allow-unsafe-pr-checkout: true
        # Otherwise the read-only GITHUB_TOKEN would override the app token when pushing the docs
        persist-credentials: false

    - name: Check out the data_in/legacy submodule
      # The submodule lives on gitlab.pik-potsdam.de and is declared with an SSH or
      # HTTPS remote, which actions/checkout cannot authenticate against on its own.
      env:
        GITLAB_TOKEN: ${{ secrets.PIK_GITLAB_TOKEN }}
      run: |
        set -eu
        if [ -z "${GITLAB_TOKEN:-}" ]; then
          echo "Secret PIK_GITLAB_TOKEN is not set for this repository." >&2
          exit 1
        fi
        git config --global \
          url."https://oauth2:${GITLAB_TOKEN}@gitlab.pik-potsdam.de/".insteadOf \
          "git@gitlab.pik-potsdam.de:"
        git config --global --add \
          url."https://oauth2:${GITLAB_TOKEN}@gitlab.pik-potsdam.de/".insteadOf \
          "https://gitlab.pik-potsdam.de/"
        git submodule update --init --depth 1 data_in/legacy

    - name: Check out the data_in/piam_mappings submodule
      # Public GitHub repository declared with an SSH remote; fetch it via HTTPS instead.
      run: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init --depth 1 data_in/piam_mappings

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        version: "0.13.7"
        python-version: "3.14"

    - name: Install
      run: uv sync --locked

    - name: Cache MFA input archive
      id: madrat-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.MADRAT_OUTPUTFOLDER }}
        # The archive only changes when `input.input_data_revision` or
        # `input.region_mapping` in config/default.toml change.
        key: madrat-mfa-${{ hashFiles('config/default.toml') }}

    - name: Configure SSH access to the HPC
      env:
        HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
        HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        HPC_HOST: ${{ secrets.HPC_HOST }}
        HPC_JUMP_HOST: ${{ secrets.HPC_JUMP_HOST }}
      run: |
        set -eu
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$HPC_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "$HPC_KNOWN_HOSTS" > ~/.ssh/known_hosts
        # The cluster is only reachable through the PIK login gateway
        {
          printf 'Host hpc\n'
          printf '  HostName %s\n' "${HPC_HOST##*@}"
          printf '  User %s\n' "${HPC_HOST%@*}"
          printf '  ProxyJump %s\n' "$HPC_JUMP_HOST"
        } > ~/.ssh/config
        chmod 600 ~/.ssh/config

    - name: Download MFA input archive
      if: steps.madrat-cache.outputs.cache-hit != 'true'
      run: uv run scripts/fetch_from_hpc.py mfa-archive hpc --config default --config ci

    - name: Run model
      run: uv run remind-mfa --config default --config ci --model all --no-viewer

    - name: Check out baseline
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ env.BASELINE_REF }}
        path: baseline
        submodules: false

    - name: Run baseline model
      id: baseline
      continue-on-error: true
      working-directory: baseline
      run: |
        set -eu
        git submodule update --init --depth 1 data_in/legacy
        if git config -f .gitmodules --get submodule.data_in/piam_mappings.path > /dev/null; then
          git submodule update --init --depth 1 data_in/piam_mappings
        fi
        uv sync --locked
        # Download old MFA archive if config changed
        if ! cmp -s config/default.toml "$GITHUB_WORKSPACE/config/default.toml"; then
          uv run scripts/fetch_from_hpc.py mfa-archive hpc --config default --config ci
        fi
        printf '[base]\n    [base.export]\n        prefix = "baseline"\n' > config/baseline.toml
        uv run remind-mfa --config default --config ci --config baseline --model all --no-viewer
        uv run blicket build "$BASELINE_RUN" --out "$BASELINE_BUILD"
        ref="${BASELINE_REF#refs/heads/}"
        short_sha="$(git rev-parse --short HEAD)"
        if [ "${#ref}" -ge 40 ]; then label="$short_sha"; else label="$ref@$short_sha"; fi
        echo "label=$label" >> "$GITHUB_OUTPUT"

    - name: Compare with baseline
      id: compare
      continue-on-error: true
      run: |
        set -u
        args=()
        baseline=""
        for candidate in "$BASELINE_BUILD"/*/; do
          if [ -f "$candidate/manifest.json" ]; then baseline="$candidate"; break; fi
        done
        if [ -n "$baseline" ]; then
          args+=(--against "$baseline")
        else
          echo "::warning::No baseline build; the run is built without a comparison" >&2
        fi
        code=0
        GITHUB_STEP_SUMMARY="$SUMMARY" uv run blicket check "$RUN" "${args[@]}" --out "$BUILD" || code=$?
        if [ -s "$SUMMARY" ]; then
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        fi
        build=""
        for candidate in "$BUILD"/*/; do
          if [ -f "$candidate/manifest.json" ] && [ -f "$candidate/index.html" ]; then
            build="$candidate"
            break
          fi
        done
        if [ -z "$build" ]; then
          echo "::error::blicket built no viewer, see above" >&2
          exit 1
        fi
        # The build directory is self-contained: the viewer, the manifest and the Blick tables,
        # the aggregated chart data. The input data behind the runs is private: nothing else
        # may be deployed, never a pickle, CSV or input file.
        cp -r "$build" site
        if find site -type f \( -name '*.pickle' -o -name '*.cs4r' -o -name '*.csv' -o -name '*.xlsx' -o -name '*.tgz' \) | grep -q .; then
          echo "::error::site/ contains run outputs or input data; not deploying" >&2
          rm -rf site
          exit 1
        fi
        echo "staged=true" >> "$GITHUB_OUTPUT"
        du -sh site
        [ "$code" -ne 2 ]

    - name: Deploy to Cloudflare Pages
      id: deploy
      if: env.CLOUDFLARE_API_TOKEN != '' && steps.compare.outputs.staged == 'true'
      uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: >-
          pages deploy site
          --project-name=remind-mfa-test
          --branch=${{ github.head_ref || github.ref_name }}
          --commit-dirty=true

    - name: Create PR message
      id: message
      if: steps.deploy.outcome == 'success'
      env:
        URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
        BASELINE_LABEL: ${{ steps.baseline.outputs.label }}
      run: |
        set -eu
        message=$( {
          echo "Blicks of this run: $URL"
          echo ""
          if [ "$BASELINE_OUTCOME" != success ]; then
            echo "Error: baseline run did not succeed, see the workflow log."
          elif [ -s "$SUMMARY" ]; then
            echo "Comparison against \`$BASELINE_LABEL\`:"
            echo ""
            cat "$SUMMARY"
          else
            echo "No comparison against \`$BASELINE_LABEL\`, see the workflow log."
          fi
          if [ "$COMPARE_OUTCOME" = failure ]; then
            echo ""
            echo "(blicket reported an error, see the workflow log)"
          fi
        } )
        {
          echo "message<<MESSAGE_END"
          echo "$message"
          echo "MESSAGE_END"
        } >> "$GITHUB_OUTPUT"
        echo "$message" >> "$GITHUB_STEP_SUMMARY"

    - name: Comment URL on PR
      if: steps.message.outcome == 'success' && github.event_name == 'pull_request_target'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: preview
        message: ${{ steps.message.outputs.message }}

    - name: Regenerate docs
      id: docs
      if: github.event_name == 'pull_request_target'
      run: |
        set -eu
        uv run remind-mfa --config default --config update_docs --model all --no-viewer
        git add --all docs
        if ! git diff --cached --quiet; then
          git diff --cached --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub App token
      id: app-token
      if: steps.docs.outputs.changed == 'true'
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ vars.REMIND_BOT_APP_CLIENT_ID }}
        private-key: ${{ secrets.REMIND_BOT_APP_PRIVATE_KEY }}
        permission-contents: write

    - name: Commit and push docs
      if: steps.app-token.outcome == 'success'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -eu
        user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
        git config user.name "${APP_SLUG}[bot]"
        git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
        git commit -m "docs: update auto-generated docs"
        remote="https://x-access-token:${GH_TOKEN}@github.com/${HEAD_REPO}.git"
        if ! git push "$remote" "HEAD:refs/heads/${HEAD_REF}"; then
          if [ "$(git ls-remote "$remote" "refs/heads/${HEAD_REF}" | cut -f1)" != "$HEAD_SHA" ]; then
            echo "::notice::Updated docs have been pushed to the PR branch."
            exit 0
          fi
          echo "::error::Could not push the updated docs. Allow edits by maintainers on the PR," \
            "or run 'uv run remind-mfa --config default --config update_docs --model all --no-viewer' and commit docs/."
          exit 1
        fi
