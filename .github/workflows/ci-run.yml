name: CI

on:
  push:
    branches: [ "main" ]
  pull_request_target:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-model:
    name: Run model
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: run-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      MADRAT_OUTPUTFOLDER: ${{ github.workspace }}/madrat_output
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    # Guard: Only run this job on PRs only for trusted contributors (since we are using secrets and accessing the HPC)
    if: github.event_name != 'pull_request_target' || github.event.pull_request.author_association == 'COLLABORATOR'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        submodules: false
        allow-unsafe-pr-checkout: true

    - name: Check out the data_in/legacy submodule
      # The submodule lives on gitlab.pik-potsdam.de and is declared with an SSH
      # remote, which actions/checkout cannot authenticate against on its own.
      env:
        GITLAB_TOKEN: ${{ secrets.PIK_GITLAB_TOKEN }}
      run: |
        set -eu
        if [ -z "${GITLAB_TOKEN:-}" ]; then
          echo "Secret PIK_GITLAB_TOKEN is not set for this repository." >&2
          exit 1
        fi
        git config --global \
          url."https://oauth2:${GITLAB_TOKEN}@gitlab.pik-potsdam.de/".insteadOf \
          "git@gitlab.pik-potsdam.de:"
        git submodule update --init --depth 1 data_in/legacy

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true
        version: "0.11.28"
        python-version: "3.14"

    - name: Install
      run: uv sync --locked

    - name: Cache MFA input archive
      id: madrat-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.MADRAT_OUTPUTFOLDER }}
        # The archive only changes when `input.input_data_revision` or
        # `input.region_mapping` in config/default.toml change.
        key: madrat-mfa-${{ hashFiles('config/default.toml') }}

    - name: Configure SSH access to the HPC
      if: steps.madrat-cache.outputs.cache-hit != 'true'
      env:
        HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
        HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        HPC_HOST: ${{ secrets.HPC_HOST }}
        HPC_JUMP_HOST: ${{ secrets.HPC_JUMP_HOST }}
      run: |
        set -eu
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$HPC_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "$HPC_KNOWN_HOSTS" > ~/.ssh/known_hosts
        # The cluster is only reachable through the PIK login gateway
        {
          printf 'Host hpc\n'
          printf '  HostName %s\n' "${HPC_HOST##*@}"
          printf '  User %s\n' "${HPC_HOST%@*}"
          printf '  ProxyJump %s\n' "$HPC_JUMP_HOST"
        } > ~/.ssh/config
        chmod 600 ~/.ssh/config

    - name: Download MFA input archive
      if: steps.madrat-cache.outputs.cache-hit != 'true'
      run: uv run scripts/fetch_from_hpc.py mfa-archive hpc --config default --config ci

    - name: Run model
      run: uv run remind_mfa.py --config default --config ci --model all

    - name: Stage for deployment
      # The above run exports all figures as HTML into data_out/ci_series/
      # Copy only the HTML pages and plotly.min.js; pickles etc. may exceed Cloudflare's file size limit.
      run: |
        set -eu
        rm -rf site
        rsync -am --include='*/' --include='*.html' --include='*.js' --exclude='*' \
          data_out/ci_series/ site/
        test -f site/index.html
        du -sh site

    - name: Deploy figures to Cloudflare Pages
      id: deploy
      if: env.CLOUDFLARE_API_TOKEN != ''
      uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: >-
          pages deploy site
          --project-name=remind-mfa-test
          --branch=${{ github.head_ref || github.ref_name }}
          --commit-dirty=true

    - name: Add URL to summary
      if: steps.deploy.outcome == 'success'
      env:
        URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
      run: echo "Interactive preview at $URL" >> "$GITHUB_STEP_SUMMARY"

    - name: Comment URL on PR
      if: steps.deploy.outcome == 'success' && github.event_name == 'pull_request_target'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: preview
        message: |
          Interactive preview at ${{ steps.deploy.outputs.pages-deployment-alias-url }}
